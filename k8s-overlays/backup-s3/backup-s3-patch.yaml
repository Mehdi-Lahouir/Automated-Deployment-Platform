apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: task-manager
  labels:
    backup.task-manager/backend: s3
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup-agent
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:http://minio:9000/task-manager-backups
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-secrets
                      key: MINIO_ROOT_USER
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-secrets
                      key: MINIO_ROOT_PASSWORD
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
---
